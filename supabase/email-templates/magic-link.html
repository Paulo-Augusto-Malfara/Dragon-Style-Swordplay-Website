<!--
  Template de e-mail para login (código de verificação) do Dragon Style Swordplay.
  Colar em: Supabase Dashboard -> Authentication -> Email Templates -> Magic Link
  Variavel usada pelo Supabase: {{ .Token }} (código de 6 dígitos)
-->
<div style="margin:0; padding:0; background-color:#0a0a0a; width:100%;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0a0a0a; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; background-color:#151f28; border:1px solid rgba(232,172,70,0.35); border-radius:12px; overflow:hidden;">

          <!-- Logo / Header -->
          <tr>
            <td align="center" style="padding:32px 24px 16px 24px;">
              <img
                src="https://swordplayds.com.br/assets/img/logo-ds-landscape.webp"
                alt="Dragon Style Swordplay"
                width="220"
                style="display:block; max-width:220px; width:100%; height:auto; border:0;"
              />
            </td>
          </tr>

          <!-- Title -->
          <tr>
            <td align="center" style="padding:8px 32px 0 32px;">
              <h1 style="margin:0; font-family:Georgia,'Bree Serif',serif; font-size:22px; line-height:1.3; color:#e8ac46;">
                Seu acesso ao Dragon Style
              </h1>
            </td>
          </tr>

          <!-- Body text -->
          <tr>
            <td align="center" style="padding:16px 32px 0 32px;">
              <p style="margin:0; font-family:Arial,Helvetica,sans-serif; font-size:15px; line-height:1.6; color:#e0e0e0;">
                Use o código abaixo para entrar no seu painel de membro.
                Ele é válido por um tempo limitado e só pode ser usado uma vez.
              </p>
            </td>
          </tr>

          <!-- Code -->
          <tr>
            <td align="center" style="padding:28px 32px;">
              <div
                style="display:inline-block; padding:16px 32px; background-color:#1a2029; border:1px solid rgba(232,172,70,0.35); border-radius:8px; font-family:Arial,Helvetica,sans-serif; font-size:32px; font-weight:bold; letter-spacing:8px; color:#e8ac46;"
              >
                {{ .Token }}
              </div>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding:20px 32px; border-top:1px solid rgba(232,172,70,0.2);">
              <p style="margin:0; font-family:Arial,Helvetica,sans-serif; font-size:12px; line-height:1.6; color:#8a8a8a;">
                Se você não pediu este acesso, pode ignorar este e-mail com segurança.<br />
                Dragon Style Swordplay
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</div>
